spring.application.name=tp-autoloc

# Connexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8080

# Creation des tables via Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Prefixe commun de l'API
server.servlet.context-path=/api

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.tpautoloc=INFO
